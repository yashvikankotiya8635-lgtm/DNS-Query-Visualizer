<!DOCTYPE html>
<html>
<head>
    <title>DNS Query Visualizer Dashboard</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
        body {
            background-color: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #00ff88;
        }

        h2 {
            color: #00ff88;
        }

        .stats-box {
            background: #16213e;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
            margin: 10px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #00ff88;
        }

        .button-box {
            text-align: center;
            margin-bottom: 20px;
        }

        .btn {
            background: #00ff88;
            color: black;
            padding: 10px 20px;
            margin: 5px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn-blue {
            background: #00aaff;
            color: white;
        }

        .box {
            background: #16213e;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        #map {
            height: 300px;
            border: 2px solid #00ff88;
            border-radius: 10px;
        }

        .alert-item {
            padding: 10px;
            margin: 8px 0;
            background: #0f172a;
            border-radius: 6px;
            border-left: 5px solid #00ff88;
        }

        .PHISHING { border-left-color: #ff4444; }
        .MALWARE { border-left-color: #ff8800; }
        .MALICIOUS { border-left-color: #8b0000; }
        .SAFE { border-left-color: #00ff88; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #0f172a;
            color: white;
        }

        th, td {
            padding: 10px;
            border: 1px solid #334155;
            text-align: center;
        }

        th {
            background: #00ff88;
            color: black;
        }
    </style>
</head>

<body>

    <h1>🌐 DNS Query Visualizer Dashboard</h1>

    <div class="stats-box">
        <div class="stat-item">
            <div class="stat-number" id="total">0</div>
            <div>Total Queries</div>
        </div>

        <div class="stat-item">
            <div class="stat-number" id="phishing" style="color:#ff4444;">0</div>
            <div>🔴 Phishing</div>
        </div>

        <div class="stat-item">
            <div class="stat-number" id="malware" style="color:#ff8800;">0</div>
            <div>🟠 Malware</div>
        </div>

        <div class="stat-item">
            <div class="stat-number" id="safe" style="color:#00ff88;">0</div>
            <div>✅ Safe</div>
        </div>

        <div class="stat-item">
            <div class="stat-number" id="countries" style="color:#00aaff;">0</div>
            <div>🌍 Countries</div>
        </div>
    </div>

    <div class="button-box">
        <a class="btn" href="/map" target="_blank">View Folium World Map</a>
        <a class="btn btn-blue" href="/graph" target="_blank">View Top Domains Graph</a>
    </div>

    <div class="box">
        <h2>🚨 Live Cyber Alerts</h2>
        <div id="alert-list">Loading alerts...</div>
    </div>

    <div class="box">
        <h2>📋 Recent DNS Records</h2>
        <div id="records-table">Loading records...</div>
    </div>

    <div class="box">
        <h2>🌍 Live DNS Activity Map</h2>
        <div id="map"></div>
    </div>

    <script>
        var map = L.map('map').setView([20, 0], 2);

        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
        ).addTo(map);

        var markers = [];

        function clearMarkers() {
            markers.forEach(function(marker) {
                map.removeLayer(marker);
            });
            markers = [];
        }

        function addDotOnMap(lat, lon, color, domain, attack, ip, country, city) {
            var marker = L.circleMarker([lat, lon], {
                color: color,
                fillColor: color,
                fillOpacity: 0.8,
                radius: 7
            }).addTo(map)
            .bindPopup(`
                <b>Domain:</b> ${domain}<br>
                <b>IP:</b> ${ip}<br>
                <b>Status:</b> ${attack}<br>
                <b>Country:</b> ${country}<br>
                <b>City:</b> ${city}
            `);

            markers.push(marker);
        }

        function updateStats(stats) {
            document.getElementById('total').innerHTML = stats.total_queries;
            document.getElementById('phishing').innerHTML = stats.phishing_detected;
            document.getElementById('malware').innerHTML = stats.malware_detected;
            document.getElementById('safe').innerHTML = stats.safe_queries;
            document.getElementById('countries').innerHTML = stats.countries_involved.length;
        }

        function showAlerts(alerts) {
            var alertList = document.getElementById('alert-list');
            alertList.innerHTML = '';

            if (alerts.length === 0) {
                alertList.innerHTML = '<p>✅ No suspicious activity detected.</p>';
                return;
            }

            alerts.slice(-10).reverse().forEach(function(alert) {
                alertList.innerHTML += `
                    <div class="alert-item ${alert.attack}">
                        <b>${alert.attack}</b><br>
                        Domain: ${alert.domain}<br>
                        Country: ${alert.country}<br>
                        Time: ${alert.time}
                    </div>
                `;
            });
        }

        function showRecords(queries) {
            var tableDiv = document.getElementById('records-table');

            if (queries.length === 0) {
                tableDiv.innerHTML = '<p>No DNS records found.</p>';
                return;
            }

            var html = `
                <table>
                    <tr>
                        <th>Domain</th>
                        <th>IP Address</th>
                        <th>Country</th>
                        <th>City</th>
                        <th>Status</th>
                    </tr>
            `;

            queries.slice(-10).reverse().forEach(function(q) {
                html += `
                    <tr>
                        <td>${q.domain}</td>
                        <td>${q.ip}</td>
                        <td>${q.country}</td>
                        <td>${q.city}</td>
                        <td>${q.attack_type}</td>
                    </tr>
                `;
            });

            html += `</table>`;
            tableDiv.innerHTML = html;
        }

        function updateDashboard() {
            clearMarkers();

            fetch('/get-queries')
            .then(response => response.json())
            .then(function(queries) {
                showRecords(queries);

                queries.forEach(function(query) {
                    if (query.lat && query.lon) {
                        addDotOnMap(
                            query.lat,
                            query.lon,
                            query.color,
                            query.domain,
                            query.attack_type,
                            query.ip,
                            query.country,
                            query.city
                        );
                    }
                });
            });

            fetch('/get-alerts')
            .then(response => response.json())
            .then(showAlerts);

            fetch('/get-stats')
            .then(response => response.json())
            .then(updateStats);
        }

        updateDashboard();

        setInterval(updateDashboard, 5000);
    </script>

</body>
</html>
